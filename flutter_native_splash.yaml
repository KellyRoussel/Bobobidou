# flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#fbd1b9"
  # Logo faded into the peach background (no square edge)
  image: assets/icon/splash.png
  android_12:
    color: "#fbd1b9"
    # Without its own image, Android 12+ reuses the launcher icon inside a white circle
    image: assets/icon/splash_android12.png
    icon_background_color: "#fbd1b9"
