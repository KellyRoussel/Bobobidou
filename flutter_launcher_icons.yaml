# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/logo.jpg"

  android: "launcher_icon"
  # image_path_android: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  # Adaptive icon (Android 8+): peach background, logo faded on top
  adaptive_icon_background: "#FBD1B9"
  adaptive_icon_foreground: "assets/icon/launcher_foreground.png"
  # The margin is already in the image
  adaptive_icon_foreground_inset: 0
  # adaptive_icon_monochrome: "assets/icon/monochrome.png"


